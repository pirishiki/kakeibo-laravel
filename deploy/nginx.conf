# EC2 の nginx の設定（/etc/nginx/nginx.conf に置く。scripts/deploy.sh が置きかえる）。
# CloudFront から 80 番で届いたものを、Laravel（PHP-FPM）に渡す。形は Laravel の公式の説明（Deployment > Nginx）どおり。
# Amazon Linux の最初の設定にある見本のサーバー（/usr/share/nginx/html）は使わないので、ファイルごと置きかえる

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    # エラーの画面などに nginx の版を出さない
    server_tokens off;

    # ファイルの種類の表を読むための大きさ。Amazon Linux の最初の設定と同じにする（小さいと、動かすたびに注意が出る）
    types_hash_max_size 4096;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/kakeibo/public;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ ^/index\.php(/|$) {
            fastcgi_pass unix:/run/php-fpm/kakeibo.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
            # 返事をメモリで受け取る大きさ。最初の設定（32〜64 KB）だと、記録の一覧（1 か月で約 130 KB、500 件で約 450 KB）が
            # いったん一時ファイルに書かれ、error.log に注意が出るため、4 MB まで入るようにする（2 回目のデプロイで見つかった）。
            # 名前や探す条件がとても長いと、まれにこれをこえる。そのときも一時ファイルを使うだけで、返事は正しく届く。
            # メモリは返事の大きさの分だけ使う（1 人で使うので、同時の返事は数件）。
            # 数を変えるときは、fastcgi_busy_buffers_size（書いていないので 2 × 64k ＝ 128k）が、
            # fastcgi_buffer_size 以上で、(buffers の数 − 1) × 1 つの大きさ以下になるようにする（でないと nginx -t が通らない）
            fastcgi_buffer_size 64k;
            fastcgi_buffers 64 64k;
        }

        # .env など、点で始まるファイルは見せない
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
