# EC2 の nginx の設定（/etc/nginx/nginx.conf に置く。scripts/deploy.sh が置きかえる）。
# CloudFront から 80 番で届いたものを、Laravel（PHP-FPM）に渡す。形は Laravel の公式の説明（Deployment > Nginx）どおり。
# Amazon Linux の最初の設定にある見本のサーバー（/usr/share/nginx/html）は使わないので、ファイルごと置きかえる

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    # エラーの画面などに nginx の版を出さない
    server_tokens off;

    # ファイルの種類の表を読むための大きさ。Amazon Linux の最初の設定と同じにする（小さいと、動かすたびに注意が出る）
    types_hash_max_size 4096;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/kakeibo/public;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ ^/index\.php(/|$) {
            fastcgi_pass unix:/run/php-fpm/kakeibo.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        # .env など、点で始まるファイルは見せない
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
