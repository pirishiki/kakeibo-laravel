; EC2 の PHP-FPM の設定（/etc/php-fpm.d/kakeibo.conf に置く。scripts/deploy.sh が置く）。
; アプリを動かす利用者 kakeibo で PHP を動かす。nginx とは、この利用者だけが使える通り道（ソケット）でつなぐ。
; Amazon Linux の最初の設定（www.conf。利用者 apache）は、scripts/deploy.sh が止める

[kakeibo]
user = kakeibo
group = kakeibo

listen = /run/php-fpm/kakeibo.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

; 来たときだけ PHP を起こす（1 人で使うアプリで、メモリ 1GB の EC2 なので少なめ）
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s

; PHP の思わぬエラーの記録。アプリのエラーは Laravel のログ（storage/logs）に残る
php_admin_value[error_log] = /var/log/php-fpm/kakeibo-error.log
php_admin_flag[log_errors] = on
